name: GitHub Actions Secrets Probe

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-secrets:
    name: Repository secrets / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PROBE_SCOPE: repository
      IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
      EXPECTED_STORAGE_ACCESS_KEY_SHA256: ${{ vars.EXPECTED_STORAGE_ACCESS_KEY_SHA256 }}
      EXPECTED_STORAGE_SECRET_KEY_SHA256: ${{ vars.EXPECTED_STORAGE_SECRET_KEY_SHA256 }}
      EXPECTED_STORAGE_BUCKET_SHA256: ${{ vars.EXPECTED_STORAGE_BUCKET_SHA256 }}
      EXPECTED_STORAGE_ENDPOINT_SHA256: ${{ vars.EXPECTED_STORAGE_ENDPOINT_SHA256 }}
      EXPECTED_STORAGE_REGION_SHA256: ${{ vars.EXPECTED_STORAGE_REGION_SHA256 }}
      EXPECTED_SPECIAL_CHARS_SECRET_SHA256: ${{ vars.EXPECTED_SPECIAL_CHARS_SECRET_SHA256 }}
      EXPECTED_APOSTROPHE_SECRET_SHA256: ${{ vars.EXPECTED_APOSTROPHE_SECRET_SHA256 }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Probe step-level env
        env:
          STORAGE_ACCESS_KEY: ${{ secrets.STORAGE_ACCESS_KEY }}
          STORAGE_SECRET_KEY: ${{ secrets.STORAGE_SECRET_KEY }}
          STORAGE_BUCKET: ${{ secrets.STORAGE_BUCKET }}
          STORAGE_ENDPOINT: ${{ secrets.STORAGE_ENDPOINT }}
          STORAGE_REGION: ${{ secrets.STORAGE_REGION }}
          SPECIAL_CHARS_SECRET: ${{ secrets.SPECIAL_CHARS_SECRET }}
          APOSTROPHE_SECRET: ${{ secrets.APOSTROPHE_SECRET }}
          DOES_NOT_EXIST: ${{ secrets.DOES_NOT_EXIST }}
        run: npm run probe -- env

      - name: Probe CLI arguments
        run: >-
          npm run probe -- cli
          --storage-access-key '${{ secrets.STORAGE_ACCESS_KEY }}'
          --storage-secret-key '${{ secrets.STORAGE_SECRET_KEY }}'
          --storage-bucket '${{ secrets.STORAGE_BUCKET }}'
          --storage-endpoint '${{ secrets.STORAGE_ENDPOINT }}'
          --storage-region '${{ secrets.STORAGE_REGION }}'
          --special-chars-secret '${{ secrets.SPECIAL_CHARS_SECRET }}'
          --does-not-exist '${{ secrets.DOES_NOT_EXIST }}'

      - name: Probe apostrophe through env
        env:
          APOSTROPHE_SECRET: ${{ secrets.APOSTROPHE_SECRET }}
        run: npm run probe -- env

      - name: Probe apostrophe through single-quoted CLI
        id: apostrophe_cli
        continue-on-error: true
        run: >-
          npm run probe -- cli
          --apostrophe-secret '${{ secrets.APOSTROPHE_SECRET }}'

      - name: Record apostrophe CLI outcome
        if: always()
        run: npm run probe -- outcome apostrophe-cli ${{ steps.apostrophe_cli.outcome }}

  environment-secrets:
    name: Environment secrets / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    environment: staging
    env:
      PROBE_SCOPE: staging-environment
      IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
      EXPECTED_STORAGE_ACCESS_KEY_SHA256: ${{ vars.EXPECTED_STORAGE_ACCESS_KEY_SHA256 }}
      EXPECTED_STORAGE_SECRET_KEY_SHA256: ${{ vars.EXPECTED_STORAGE_SECRET_KEY_SHA256 }}
      EXPECTED_STORAGE_BUCKET_SHA256: ${{ vars.EXPECTED_STORAGE_BUCKET_SHA256 }}
      EXPECTED_STORAGE_ENDPOINT_SHA256: ${{ vars.EXPECTED_STORAGE_ENDPOINT_SHA256 }}
      EXPECTED_STORAGE_REGION_SHA256: ${{ vars.EXPECTED_STORAGE_REGION_SHA256 }}
      EXPECTED_SPECIAL_CHARS_SECRET_SHA256: ${{ vars.EXPECTED_SPECIAL_CHARS_SECRET_SHA256 }}
      EXPECTED_APOSTROPHE_SECRET_SHA256: ${{ vars.EXPECTED_APOSTROPHE_SECRET_SHA256 }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Probe step-level env
        env:
          STORAGE_ACCESS_KEY: ${{ secrets.STORAGE_ACCESS_KEY }}
          STORAGE_SECRET_KEY: ${{ secrets.STORAGE_SECRET_KEY }}
          STORAGE_BUCKET: ${{ secrets.STORAGE_BUCKET }}
          STORAGE_ENDPOINT: ${{ secrets.STORAGE_ENDPOINT }}
          STORAGE_REGION: ${{ secrets.STORAGE_REGION }}
          SPECIAL_CHARS_SECRET: ${{ secrets.SPECIAL_CHARS_SECRET }}
          APOSTROPHE_SECRET: ${{ secrets.APOSTROPHE_SECRET }}
          DOES_NOT_EXIST: ${{ secrets.DOES_NOT_EXIST }}
        run: npm run probe -- env

      - name: Probe CLI arguments
        run: >-
          npm run probe -- cli
          --storage-access-key '${{ secrets.STORAGE_ACCESS_KEY }}'
          --storage-secret-key '${{ secrets.STORAGE_SECRET_KEY }}'
          --storage-bucket '${{ secrets.STORAGE_BUCKET }}'
          --storage-endpoint '${{ secrets.STORAGE_ENDPOINT }}'
          --storage-region '${{ secrets.STORAGE_REGION }}'
          --special-chars-secret '${{ secrets.SPECIAL_CHARS_SECRET }}'
          --does-not-exist '${{ secrets.DOES_NOT_EXIST }}'

      - name: Probe apostrophe through env
        env:
          APOSTROPHE_SECRET: ${{ secrets.APOSTROPHE_SECRET }}
        run: npm run probe -- env

      - name: Probe apostrophe through single-quoted CLI
        id: apostrophe_cli
        continue-on-error: true
        run: >-
          npm run probe -- cli
          --apostrophe-secret '${{ secrets.APOSTROPHE_SECRET }}'

      - name: Record apostrophe CLI outcome
        if: always()
        run: npm run probe -- outcome apostrophe-cli ${{ steps.apostrophe_cli.outcome }}

